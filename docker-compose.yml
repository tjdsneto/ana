# DRAFT — topology for the v0 PoC (see docs/specs/07-compose-and-runtime.md).
# The `db` service works today; the app services build once their code + Dockerfiles land,
# so this will not `up` end-to-end yet. Kept in the repo to pin the shape.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-server:
    build: ./server/mcp          # TODO: Dockerfile lands with the code
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-8787}
      ARTIFACTS_DIR: /data/artifacts
    ports:
      - "${MCP_HTTP_PORT:-8787}:8787"
    volumes:
      - ./server/data/artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  engine-worker:
    build: ./engine              # TODO: Dockerfile lands with the code
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
      ARTIFACTS_DIR: /data/artifacts
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-3000}
      MAX_REDOS: ${MAX_REDOS:-3}
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      # RENDER_PROVIDER=stub   # keep stubbed until keys land
    volumes:
      - ./server/data/artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  web-api:
    build: ./server/api          # TODO: Dockerfile lands with the code
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
      MCP_HTTP_URL: http://mcp-server:8787
      WEB_API_PORT: ${WEB_API_PORT:-8788}
      ARTIFACTS_DIR: /data/artifacts
    ports:
      - "${WEB_API_PORT:-8788}:8788"
    volumes:
      - ./server/data/artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./app                 # TODO: Dockerfile lands with the code (React + Vite)
    environment:
      VITE_WEB_API_URL: http://localhost:${WEB_API_PORT:-8788}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - web-api

volumes:
  pgdata:
