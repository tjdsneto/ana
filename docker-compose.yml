# v0 PoC topology (spec 07). One image (root Dockerfile) runs every TS/Node service; each service just
# overrides the command. Render stays stubbed and the engine runs the FAKE subagent
# (ENGINE_FAKE_SUBAGENT=1) so the whole stack runs end-to-end with no render keys and no `claude` binary.

x-engine-image: &engine-image
  build:
    context: .
    dockerfile: Dockerfile
    target: base          # the slim image (no claude CLI); engine-worker overrides to target: engine
  image: production-engine:local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply migrations + seed the default account/user, then exit. The long-running services
  # wait for it to complete so they never race an empty schema.
  migrate:
    <<: *engine-image
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    <<: *engine-image
    command: ["node", "server/mcp/dist/http.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-8787}
      ARTIFACTS_DIR: /data/artifacts
    ports:
      - "${MCP_HTTP_PORT:-8787}:8787"
    volumes:
      - ./server/data/artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  engine-worker:
    <<: *engine-image
    build:
      context: .
      dockerfile: Dockerfile
      target: engine           # the image WITH the Claude Code CLI (claude -p)
    image: production-engine-claude:local
    command: ["node", "engine/dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
      ARTIFACTS_DIR: /data/artifacts
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-3000}
      MAX_REDOS: ${MAX_REDOS:-3}
      # Subagent engine. Default: fake — canned output, no `claude` call, ZERO spend. To run the real
      # engine on your Claude subscription, set SUBAGENT_ENGINE=claude and inject the token at launch,
      # e.g.:  CLAUDE_CODE_OAUTH_TOKEN=$(op read "op://Private/claude-code/token") SUBAGENT_ENGINE=claude docker compose up engine-worker
      SUBAGENT_ENGINE: ${SUBAGENT_ENGINE:-fake}
      SUBAGENT_MODEL: ${SUBAGENT_MODEL:-}
      SUBAGENT_MAX_BUDGET_USD: ${SUBAGENT_MAX_BUDGET_USD:-}   # per-call client-side spend cap (uncapped if empty)
      # Process-lifetime ceiling on REAL subagent calls. Once hit, the worker parks idle (in-flight leaf
      # finishes) until restart — so a retained volume full of stale queued nodes can't drain into a big
      # unintended spend. fake calls never count. Empty = uncapped. Set it low for a real-claude smoke run.
      SUBAGENT_MAX_CALLS: ${SUBAGENT_MAX_CALLS:-}
      # Subscription auth. NEVER set ANTHROPIC_API_KEY / ANTHROPIC_AUTH_TOKEN here — either one silently
      # outranks the OAuth token and bills the API instead of the subscription.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ./server/data/artifacts:/data/artifacts
      # Bind the engine's Claude Code state (~/.claude: session transcripts under projects/, config,
      # cached creds) to a host folder in the repo (gitignored) so you can browse past sessions directly
      # in Finder/your editor. Engine-owned (not shared like artifacts). Survives container recreation;
      # --resume keeps working across restarts. HOME is /root in the (root) engine image.
      # Transcripts: engine/data/claude/projects/-repo/<session>.jsonl
      - ./engine/data/claude:/root/.claude
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web-api:
    <<: *engine-image
    command: ["node", "server/api/dist/index.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
      WEB_API_PORT: ${WEB_API_PORT:-8788}
      ARTIFACTS_DIR: /data/artifacts
    ports:
      - "${WEB_API_PORT:-8788}:8788"
    volumes:
      - ./server/data/artifacts:/data/artifacts   # read produced artifacts for get_deliverable
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Production web: nginx serves the built SPA and proxies /api + /ws to web-api (one origin). This is
  # the default `docker compose up` web. For hot-reload development use the `web-dev` service below.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: production-engine-web:local
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - web-api

  # Development web: the Vite dev server (hot reload), proxying /api + /ws to web-api itself. Only
  # starts under the `dev` profile (docker compose --profile dev up), so a plain up runs prod nginx.
  web-dev:
    <<: *engine-image
    command: ["sh", "-c", "npm -w @app/web run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      WEB_API_URL: http://web-api:8788   # Vite proxies /api + /ws here (server-side, cross-container)
      WEB_PORT: "5173"
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    depends_on:
      - web-api
    profiles: ["dev"]

  # Dev toolbox — a Node 24 + npm 12 shell (the same pinned image as every service) for host-free
  # install / build / test / add-a-dep. The host needs only Docker, never a local Node. Drive it with
  # the ./x wrapper: `./x npm ci`, `./x npm test`, `./x npm run build`, `./x sh`.
  #
  # The repo is bind-mounted LIVE at /work, but every node_modules sits in a NAMED VOLUME so the
  # container's Linux-arch install (native binaries: rolldown, esbuild, pg) never overwrites the
  # host's darwin node_modules — and vice versa. One volume per node_modules that actually exists
  # (root is hoisted; app/ keeps its own). Add a workspace's volume here if it ever grows one.
  # In the `tools` profile so a plain `docker compose up` never starts it.
  toolbox:
    <<: *engine-image
    working_dir: /work
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
    volumes:
      - .:/work
      - toolbox_node_modules:/work/node_modules
      - toolbox_app_node_modules:/work/app/node_modules
    profiles: ["tools"]

volumes:
  pgdata:
  toolbox_node_modules:
  toolbox_app_node_modules:
