# Prod serving for the web app (Dockerfile `web` stage). Serves the built SPA and reverse-proxies the
# API + WebSocket to the web-api service on the Compose network, so the browser talks to ONE origin —
# the app's relative /api and /ws URLs (see app/src/api.ts, app/src/useLive.ts) work with no CORS and
# no baked-in API host, mirroring what the Vite dev server does in development.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# SPA client-side routing: serve the file if it exists, else fall back to index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# REST API → web-api. proxy_pass with no path keeps the original /api/... prefix the API routes on.
	location /api/ {
		proxy_pass http://web-api:8788;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# WebSocket (engine LISTEN/NOTIFY relay) → web-api. Needs the HTTP/1.1 Upgrade dance.
	location /ws {
		proxy_pass http://web-api:8788;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 86400s;
	}
}
